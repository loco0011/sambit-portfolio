services:
  portfolio:
    build: .
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    env_file: .env.production
    volumes:
      # Logs, sessions and the SQLite database survive rebuilds.
      - portfolio-storage:/var/www/html/storage
    networks:
      - proxy
    # No ports published: the existing Nginx container reaches us at http://portfolio:8080

networks:
  proxy:
    external: true

volumes:
  portfolio-storage:
