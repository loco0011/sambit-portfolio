# Add this file to your EXISTING Nginx container's conf.d folder.
# Replace YOURDOMAIN.com everywhere, and adjust the certbot/cert paths to match
# how your existing project already does SSL.

server {
    listen 80;
    server_name YOURDOMAIN.com www.YOURDOMAIN.com;

    # Let's Encrypt HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://YOURDOMAIN.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.YOURDOMAIN.com;

    ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN.com/privkey.pem;

    return 301 https://YOURDOMAIN.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOURDOMAIN.com;

    ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN.com/privkey.pem;

    client_max_body_size 10m;

    # Resolve the container at request time via Docker's DNS, so this Nginx
    # (and your other site) still starts even if the portfolio container is down.
    resolver 127.0.0.11 valid=30s;
    set $portfolio http://portfolio:8080;

    location / {
        proxy_pass $portfolio;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
